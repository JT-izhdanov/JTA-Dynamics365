# Field Service pack — metric definitions
#
# THE SOURCE OF TRUTH. DRAFT — requires business review and offering-owner sign-off.
# See packs/sales/metrics.yaml for field meanings.
#
# EXTRA FIELD FOR THIS PACK:
#   fact_grain   work_order | booking
#                One work order can have MANY bookings. Every metric must declare its
#                grain — mixing them double-counts work order metrics in a way that is
#                very hard to spot, because both numbers look plausible in isolation.
#                See packs/field-service/source-tables.md#the-grain-problem
#
# BLOCKING NOTE: metrics marked `business_hours: true` are currently CALENDAR-hours,
# because dim_date has no holiday/working-day calendar yet.

pack: field-service
version: 0.1.0-draft
status: draft

metrics:

  # ---------------------------------------------------------------- throughput

  - name: Work Orders Created
    description: Count of work orders created in the period.
    grain: work order
    fact_grain: work_order
    calculation: count of msdyn_workorder
    currency_basis: n/a
    time_basis: createdon
    business_hours: false
    snapshot_dependent: false
    notes: Headline reconciliation metric — must tie to Dynamics exactly before UAT.

  - name: Work Orders Completed
    description: Count of work orders completed in the period.
    grain: work order
    fact_grain: work_order
    calculation: count where msdyn_systemstatus indicates completed or posted
    currency_basis: n/a
    time_basis: msdyn_completedon
    business_hours: false
    snapshot_dependent: false
    notes: >
      VERIFY whether msdyn_systemstatus or statecode reflects the customer's process.
      Getting this wrong changes every throughput number.

  - name: Open Work Order Backlog
    description: Count of work orders not yet completed.
    grain: work order
    fact_grain: work_order
    calculation: count where msdyn_systemstatus indicates not completed
    currency_basis: n/a
    time_basis: n/a (current state)
    business_hours: false
    snapshot_dependent: false

  - name: Backlog Over Time
    description: Open work order backlog on each past date, by status.
    grain: work order x day
    fact_grain: work_order
    calculation: count from fact_workorder_snapshot by snapshot_date and status
    currency_basis: n/a
    time_basis: snapshot_date
    business_hours: false
    snapshot_dependent: true
    notes: >
      A DIFFERENTIATING METRIC. Includes the awaiting-parts trend, which service managers
      ask for constantly and which no first-party report provides.

  # ---------------------------------------------------------------- efficiency

  - name: First Time Fix Rate
    description: Share of work orders resolved on the first visit.
    grain: work order
    fact_grain: work_order
    numerator: count of work orders fixed on first visit
    denominator: count of completed work orders
    currency_basis: n/a
    time_basis: msdyn_completedon
    business_hours: false
    snapshot_dependent: false
    notes: >
      NO UNIVERSAL DEFINITION. If msdyn_firsttimefix is populated, use it. If not, derive
      as "completed with exactly one booking and no follow-up work order for the same
      asset within N days" — and AGREE that definition and N with the customer. Do not
      pick one silently; this is the metric service leadership scrutinizes most.

  - name: Repeat Visit Rate
    description: Share of work orders requiring more than one visit.
    grain: work order
    fact_grain: work_order
    numerator: count of work orders with more than one booking
    denominator: count of completed work orders
    currency_basis: n/a
    time_basis: msdyn_completedon
    business_hours: false
    snapshot_dependent: false

  - name: Travel Time Share
    description: Travel time as a share of total technician time.
    grain: booking
    fact_grain: booking
    numerator: sum of travel duration
    denominator: sum of travel duration plus on-site duration
    currency_basis: n/a
    time_basis: booking start
    business_hours: false
    snapshot_dependent: false
    notes: >
      REQUIRES booking timestamps and travel durations to be maintained in the field. If
      technicians do not update booking status on their devices, this metric is NOT
      VIABLE. Check the actual fill rate during the first build.

  - name: Wrench Time
    description: On-site working time as a share of total technician time.
    grain: booking
    fact_grain: booking
    numerator: sum of on-site duration
    denominator: sum of total booked duration
    currency_basis: n/a
    time_basis: booking start
    business_hours: false
    snapshot_dependent: false
    notes: The complement of Travel Time Share. Same data dependency.

  - name: Average Resolution Duration
    description: Elapsed time from work order creation to completion.
    grain: work order
    fact_grain: work_order
    calculation: interval from createdon to msdyn_completedon
    currency_basis: n/a
    time_basis: msdyn_completedon
    business_hours: true
    snapshot_dependent: false
    notes: CURRENTLY CALENDAR-HOURS. Report median alongside mean.

  # ---------------------------------------------------------------- resourcing

  - name: Technician Utilization
    description: Booked hours as a share of technician available capacity.
    grain: resource x period
    fact_grain: booking
    numerator: sum of booked duration
    denominator: resource available capacity less approved time off
    currency_basis: n/a
    time_basis: booking start
    business_hours: false
    snapshot_dependent: false
    notes: >
      Requires resource capacity to be maintained, and msdyn_timeoffrequest for an
      accurate denominator. If capacity is absent, exclude rather than guess.

  - name: Booking Adherence
    description: Share of bookings that started within the scheduled window.
    grain: booking
    fact_grain: booking
    numerator: count of bookings where actual arrival is within the scheduled window
    denominator: count of bookings with both scheduled and actual times
    currency_basis: n/a
    time_basis: booking start
    business_hours: false
    snapshot_dependent: false
    notes: Denominator deliberately excludes bookings lacking actual times, rather than counting them as failures.

  - name: Overtime Hours
    description: Booked hours beyond standard working hours.
    grain: resource x period
    fact_grain: booking
    calculation: booked duration outside the resource's working hours
    currency_basis: n/a
    time_basis: booking start
    business_hours: true
    snapshot_dependent: false
    notes: Requires working-hours calendars per resource. VERIFY availability.

  # ---------------------------------------------------------------- service levels

  - name: Appointment Adherence
    description: Share of work orders completed within the promised window.
    grain: work order
    fact_grain: work_order
    numerator: count completed within msdyn_timefrompromised to msdyn_timetopromised
    denominator: count of completed work orders with a promised window
    currency_basis: n/a
    time_basis: msdyn_completedon
    business_hours: false
    snapshot_dependent: false
    notes: >
      The customer-facing service level metric. Requires the promised window to be
      populated — check fill rate.

  - name: Response Time
    description: Elapsed time from work order creation to first technician arrival.
    grain: work order
    fact_grain: work_order
    calculation: interval from createdon to earliest actual arrival across bookings
    currency_basis: n/a
    time_basis: createdon
    business_hours: true
    snapshot_dependent: false
    notes: >
      Crosses grains — measured per work order but sourced from booking data. Take the
      MINIMUM arrival across bookings, not a sum, or the number is meaningless.

  # ---------------------------------------------------------------- preventive maintenance

  - name: PM Completion Rate
    description: Share of scheduled preventive maintenance completed on time.
    grain: agreement booking date
    fact_grain: work_order
    numerator: count of PM work orders completed within the scheduled window
    denominator: count of scheduled PM occurrences
    currency_basis: n/a
    time_basis: scheduled date
    business_hours: false
    snapshot_dependent: false
    notes: Requires agreements to be in use. Many customers do not use them.

  - name: Agreement Compliance
    description: Share of agreement obligations met in the period.
    grain: agreement
    fact_grain: work_order
    calculation: PM Completion Rate aggregated by agreement
    currency_basis: n/a
    time_basis: scheduled date
    business_hours: false
    snapshot_dependent: false

  # ---------------------------------------------------------------- assets

  - name: Cost Per Asset
    description: Total service cost attributed to a customer asset.
    grain: asset
    fact_grain: work_order
    calculation: sum of msdyn_totalamount_base by msdyn_customerasset
    currency_basis: base
    time_basis: msdyn_completedon
    business_hours: false
    snapshot_dependent: false
    notes: Requires assets to be tracked and linked to work orders.

  - name: Asset Failure Frequency
    description: Work orders per asset over time.
    grain: asset
    fact_grain: work_order
    calculation: count of work orders by asset and period
    currency_basis: n/a
    time_basis: createdon
    business_hours: false
    snapshot_dependent: false
    notes: >
      Identifies problem assets and warranty exposure. Strong cross-app candidate — an
      asset's service cost against the original sale value.

  - name: Parts Consumption
    description: Parts used, by product.
    grain: work order product line
    fact_grain: work_order
    calculation: sum of quantity and amount from msdyn_workorderproduct
    currency_basis: base
    time_basis: msdyn_completedon
    business_hours: false
    snapshot_dependent: false

open_questions:
  - Does the customer measure at work order or booking grain? (all metrics)
  - How is first-time fix defined, and what is N for follow-up? (First Time Fix Rate)
  - Is msdyn_systemstatus or statecode the meaningful lifecycle column? (all status metrics)
  - Are booking actual timestamps maintained in the field? (Travel Time Share, Wrench Time, Booking Adherence)
  - Is resource capacity maintained? (Technician Utilization)
  - Are agreements used? (PM metrics viability)
  - Are customer assets tracked and linked? (asset metrics viability)
  - Is the promised window populated? (Appointment Adherence viability)
