# Revenue-to-Delivery pack — metric definitions
#
# THE SOURCE OF TRUTH. DRAFT — requires business review and offering-owner sign-off.
# See packs/sales/metrics.yaml for field meanings.
#
# This pack is COMPOSED from the other packs. Every metric here depends on conformed
# dimensions being genuinely SHARED across Sales, Project Operations, and Field Service —
# not copied. See packs/README.md#the-rule-that-matters-most
#
# `requires` names the component packs each metric needs. `fno_partial: true` is inherited
# from the Project Operations scope boundary (ADR 0003): complete for Lite deployments,
# approximate for F&O-backed ones.
#
# v1 = Sales + Project Operations. v2 adds Field Service. See ADR 0004.

pack: revenue-to-delivery
version: 0.1.0-draft
status: draft

metrics:

  # ---------------------------------------------------------------- v1: sales to delivery

  - name: Realized Margin By Deal
    description: Delivered margin traced back to the opportunity that won the work.
    grain: opportunity
    requires: [sales, project-operations]
    version: v1
    calculation: Project Margin, attributed to the opportunity via salesorder contract
    currency_basis: base
    time_basis: msdyn_transactiondate
    business_hours: false
    snapshot_dependent: false
    fno_partial: true
    notes: >
      THE HEADLINE METRIC OF THE PACK, and the single best demo in the offering. No
      first-party Dynamics 365 analytics answers this. Attribution rule must be agreed
      where contracts and opportunities are not one-to-one.

  - name: Sold vs Delivered Value
    description: Won opportunity value against value actually delivered.
    grain: opportunity
    requires: [sales, project-operations]
    version: v1
    numerator: Project Revenue for the linked project
    denominator: opportunity actualvalue_base
    currency_basis: base
    time_basis: actualclosedate
    business_hours: false
    snapshot_dependent: false
    fno_partial: true
    notes: Exposes systematic over- or under-selling.

  - name: Estimate Accuracy At Sale
    description: How accurate the sales-stage estimate proved against delivered cost.
    grain: opportunity
    requires: [sales, project-operations]
    version: v1
    numerator: Project Cost actual
    denominator: estimated cost at quote or contract signature
    currency_basis: base
    time_basis: actualclosedate
    business_hours: false
    snapshot_dependent: false
    fno_partial: true
    notes: >
      Requires an estimate captured at sale time. If the customer does not capture one,
      this metric is not viable — check before promising it.

  - name: Margin By Deal Type
    description: Realized margin grouped by opportunity characteristics.
    grain: opportunity attribute
    requires: [sales, project-operations]
    version: v1
    calculation: Realized Margin By Deal, grouped by product, owner, territory, deal size band
    currency_basis: base
    time_basis: msdyn_transactiondate
    business_hours: false
    snapshot_dependent: false
    fno_partial: true
    notes: >
      Identifies which deal types consistently lose money in delivery — one of the two
      metrics in this pack that tends to change how a business sells.

  - name: Discount Impact On Margin
    description: Realized margin against the discount given at quote.
    grain: opportunity
    requires: [sales, project-operations]
    version: v1
    calculation: Realized Margin By Deal correlated against quote discount percentage
    currency_basis: base
    time_basis: actualclosedate
    business_hours: false
    snapshot_dependent: false
    fno_partial: true
    notes: >
      The second business-changing metric. Requires discount to be visible on the quote —
      either an explicit discount column or derived from list versus quoted price.

  - name: Time From Won To Delivery Start
    description: Elapsed days from opportunity close to project start.
    grain: opportunity
    requires: [sales, project-operations]
    version: v1
    calculation: datediff(project actual start, opportunity actualclosedate)
    currency_basis: n/a
    time_basis: actualclosedate
    business_hours: false
    snapshot_dependent: false
    fno_partial: false
    notes: Handover latency — often surprisingly long and rarely measured.

  - name: Contract Utilization
    description: Share of contracted value actually delivered and invoiced.
    grain: contract
    requires: [sales, project-operations]
    version: v1
    numerator: invoiced amount
    denominator: salesorder contract value
    currency_basis: base
    time_basis: n/a (current state)
    business_hours: false
    snapshot_dependent: false
    fno_partial: true

  # ---------------------------------------------------------------- v2: adds field service

  - name: Cost To Serve By Customer
    description: Total post-sale service cost against what the customer bought.
    grain: customer
    requires: [sales, project-operations, field-service]
    version: v2
    numerator: Project Cost plus Field Service work order cost
    denominator: total won value for the customer
    currency_basis: base
    time_basis: period
    business_hours: false
    snapshot_dependent: false
    fno_partial: true
    notes: >
      Identifies customers who cost more to serve than they are worth. Requires all three
      packs and a conformed dim_customer shared across them.

  - name: Net Customer Lifetime Value
    description: Lifetime revenue less lifetime delivery and service cost.
    grain: customer
    requires: [sales, project-operations, field-service]
    version: v2
    calculation: cumulative revenue less cumulative project and service cost
    currency_basis: base
    time_basis: cumulative
    business_hours: false
    snapshot_dependent: false
    fno_partial: true

  - name: Product Service Burden
    description: Post-sale service cost per unit of product sold.
    grain: product
    requires: [sales, field-service]
    version: v2
    numerator: Field Service work order cost attributed to the product or asset
    denominator: product revenue sold
    currency_basis: base
    time_basis: period
    business_hours: false
    snapshot_dependent: false
    fno_partial: false
    notes: >
      Which products generate the most service burden — valuable to both sales and
      product management, and available nowhere else. Attributes through dim_asset where
      assets are tracked.

  - name: Warranty Exposure
    description: Service cost on assets still under warranty or agreement.
    grain: asset
    requires: [sales, field-service]
    version: v2
    calculation: sum of work order cost for assets within warranty or agreement coverage
    currency_basis: base
    time_basis: msdyn_completedon
    business_hours: false
    snapshot_dependent: false
    fno_partial: false
    notes: Requires assets tracked and warranty or agreement dates maintained.

# ------------------------------------------------------------------ attribution
#
# The hard problem in this pack, and NOT a technical one. When one contract spans several
# opportunities, or one project serves several contracts, margin attribution requires an
# agreed rule. There is no technically correct answer.
#
# Candidate rules, to be agreed with the customer and DOCUMENTED per engagement:
#   - proportional to contract line value
#   - proportional to opportunity value
#   - first / primary opportunity takes all
#   - exclude many-to-many cases from deal-level metrics and report them only at
#     customer grain
#
# Whichever is chosen, apply it consistently across every metric in this pack and state
# it in the pack documentation delivered at handoff.
attribution:
  rule: TBD-per-engagement
  documented_at: handoff

open_questions:
  - Does the customer create project contracts from won opportunities, or re-key? (QUALIFYING — if they re-key, do not sell this pack)
  - What attribution rule applies where contracts and opportunities are not one-to-one?
  - Is an estimated cost captured at sale time? (Estimate Accuracy At Sale viability)
  - Is quote discount visible, explicitly or derivable? (Discount Impact On Margin viability)
  - Is there a reliable path from work order back to originating sale? (v2 metrics)
  - Which grain does leadership want — deal, contract, customer, or product?
