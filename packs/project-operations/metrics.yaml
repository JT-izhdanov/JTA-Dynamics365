# Project Operations pack — metric definitions
#
# THE SOURCE OF TRUTH. DRAFT — requires business review and offering-owner sign-off.
# See packs/sales/metrics.yaml for field meanings.
#
# BLOCKING NOTE: this pack is SCOPE GATED. Read ADR 0003 and the pack README first.
# Every metric marked `fno_partial: true` is COMPLETE for Lite deployments and PARTIAL for
# F&O-backed deployments, because posted financial detail lives in Finance & Operations and
# is out of scope. Do not present a partial metric as complete.

pack: project-operations
version: 0.1.0-draft
status: draft-scope-gated

metrics:

  # ---------------------------------------------------------------- delivery

  - name: Estimate vs Actual Hours
    description: Estimated hours against actual hours booked, by project.
    grain: project
    numerator: sum of actual hours from msdyn_actual (time classification)
    denominator: sum of estimated hours from msdyn_estimateline
    currency_basis: n/a
    time_basis: msdyn_transactiondate
    business_hours: false
    snapshot_dependent: false
    fno_partial: false
    notes: >
      Hours are Dataverse-resident in all deployment types, so this metric is complete
      regardless of deployment. It is therefore the safest headline metric for the pack.

  - name: Schedule Variance
    description: Days between planned and actual project end.
    grain: project
    calculation: datediff(msdyn_actualend, msdyn_scheduledend)
    currency_basis: n/a
    time_basis: msdyn_scheduledend
    business_hours: false
    snapshot_dependent: false
    fno_partial: false
    notes: VERIFY msdyn_actualend is reliably populated; many customers do not set it.

  - name: Estimate to Complete Drift
    description: How the estimate to complete has moved over the life of the project.
    grain: project x day
    calculation: change in remaining estimate across fact_project_snapshot dates
    currency_basis: base
    time_basis: snapshot_date
    business_hours: false
    snapshot_dependent: true
    fno_partial: false
    notes: >
      A differentiating metric — shows estimate erosion as it happens rather than at
      project close. Unavailable from Dataverse.

  # ---------------------------------------------------------------- profitability

  - name: Project Revenue
    description: Recognized or invoiced revenue by project.
    grain: project
    calculation: sum of msdyn_amount_base where transaction type indicates sales
    currency_basis: base
    time_basis: msdyn_transactiondate
    business_hours: false
    snapshot_dependent: false
    fno_partial: true
    notes: >
      PARTIAL for F&O-backed deployments — Dataverse-side actuals only, not GL-tied
      revenue. State this limitation in the proposal, not at UAT.

  - name: Project Cost
    description: Total cost booked to the project.
    grain: project
    calculation: sum of msdyn_amount_base where transaction type indicates cost
    currency_basis: base
    time_basis: msdyn_transactiondate
    business_hours: false
    snapshot_dependent: false
    fno_partial: true
    notes: PARTIAL for F&O-backed deployments.

  - name: Project Margin
    description: Revenue less cost, by project.
    grain: project
    calculation: Project Revenue - Project Cost
    currency_basis: base
    time_basis: msdyn_transactiondate
    business_hours: false
    snapshot_dependent: false
    fno_partial: true
    notes: >
      The metric customers most want from this pack, and the one most affected by the F&O
      scope boundary. For F&O-backed deployments it is an approximation from
      Dataverse-side actuals. Be explicit about that in every proposal.

  - name: Project Margin Percent
    description: Margin as a share of revenue.
    grain: project
    numerator: Project Margin
    denominator: Project Revenue
    currency_basis: base
    time_basis: msdyn_transactiondate
    business_hours: false
    snapshot_dependent: false
    fno_partial: true

  - name: Margin Trend
    description: How project margin has moved over the life of the project.
    grain: project x day
    calculation: Project Margin computed per snapshot_date from fact_project_snapshot
    currency_basis: base
    time_basis: snapshot_date
    business_hours: false
    snapshot_dependent: true
    fno_partial: true
    notes: >
      Catches margin erosion mid-delivery rather than at close — high value to services
      leadership, and not available from any first-party report.

  # ---------------------------------------------------------------- utilization

  - name: Billable Utilization
    description: Billable hours as a share of available capacity.
    grain: resource x period
    numerator: sum of hours where msdyn_billingtype indicates billable
    denominator: resource available capacity for the period
    currency_basis: n/a
    time_basis: msdyn_date
    business_hours: false
    snapshot_dependent: false
    fno_partial: false
    notes: >
      REQUIRES resource capacity to be maintained in Dataverse. Many customers do not
      maintain it. If absent, either the customer supplies capacity as a file or this
      metric is excluded — do not substitute a guessed denominator.

  - name: Total Utilization
    description: All booked hours as a share of available capacity.
    grain: resource x period
    numerator: sum of all hours
    denominator: resource available capacity for the period
    currency_basis: n/a
    time_basis: msdyn_date
    business_hours: false
    snapshot_dependent: false
    fno_partial: false

  - name: Utilization vs Target
    description: Billable utilization against the resource's target.
    grain: resource x period
    calculation: Billable Utilization - target utilization
    currency_basis: n/a
    time_basis: msdyn_date
    business_hours: false
    snapshot_dependent: false
    fno_partial: false
    notes: Requires target utilization per resource or role. Confirm the source at kickoff.

  - name: Bench Time
    description: Available capacity with no booked hours.
    grain: resource x period
    calculation: capacity less total booked hours, where positive
    currency_basis: n/a
    time_basis: period
    business_hours: false
    snapshot_dependent: false
    fno_partial: false

  # ---------------------------------------------------------------- WIP and billing

  - name: Work In Progress
    description: Delivered but not yet invoiced value.
    grain: project
    calculation: sum of unbilled sales actuals
    currency_basis: base
    time_basis: msdyn_transactiondate
    business_hours: false
    snapshot_dependent: false
    fno_partial: true
    notes: VERIFY how unbilled is represented in msdyn_transactiontypecode.

  - name: Unbilled Revenue Trend
    description: WIP over time.
    grain: project x day
    calculation: Work In Progress per snapshot_date
    currency_basis: base
    time_basis: snapshot_date
    business_hours: false
    snapshot_dependent: true
    fno_partial: true

  - name: Contract Value Remaining
    description: Contract value less invoiced to date.
    grain: contract
    calculation: salesorder contract value less invoiced amount
    currency_basis: base
    time_basis: n/a (current state)
    business_hours: false
    snapshot_dependent: false
    fno_partial: true
    notes: >
      Contract is salesorder in Project Operations — shared with the Sales pack and the
      key join for Revenue-to-Delivery.

  # ---------------------------------------------------------------- resourcing

  - name: Assignment vs Capacity
    description: Assigned hours against resource capacity, forward-looking.
    grain: resource x period
    numerator: sum of assigned hours from msdyn_resourceassignment
    denominator: resource capacity
    currency_basis: n/a
    time_basis: assignment period
    business_hours: false
    snapshot_dependent: false
    fno_partial: false
    notes: The forward-looking counterpart to utilization. Requires capacity maintained.

open_questions:
  - Which deployment type? (BLOCKING — determines whether fno_partial metrics are usable)
  - Is msdyn_actual complete for this deployment, or only partial? (all margin metrics)
  - Are resource capacity and target utilization maintained? (all utilization metrics)
  - Should unapproved time entries be included in actuals? (apply consistently everywhere)
  - How is billable vs non-billable distinguished? (utilization, margin)
  - Are project contracts always used, or are some projects internal? (contract metrics)
  - Is msdyn_actualend populated? (Schedule Variance viability)
